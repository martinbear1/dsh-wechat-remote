# Harness Remote bundle：微信网关、ClawBot、工作助手与私有资源。
# 不替换 DSH/WebUI 的官方 directory-picker；小程序的远程目录浏览由本包
# Host-only Typert Remote 服务提供，不向 WebUI 注入目录 UI。
- insert:
    - id: gate
      name: '@harness-remote/dsh-wechat-remote'
    - id: wechat-clawbot
      name: '@harness-remote/dsh-wechat-remote/clawbot'
    - id: harness-group-assistants
      name: '@harness-remote/dsh-wechat-remote/group-assistants'
    - id: harness-resource-library
      name: '@harness-remote/dsh-wechat-remote/resource-library'
