# Native DSH installation loads the same audited core shipped for CLI recovery.
# The relative gate entry mounts the embedded core and its generated Host face
# as one fiber. The nested core manifest also owns the same native client half.
# It never resolves another profile's core package.
# Assistant subpaths are this outer package's own exports. Native and profile
# resolution both preserve Node self-reference before considering other packages.
- insert:
    - id: gate
      name: './native/index.js'
    - id: wechat-clawbot
      name: 'dsh-wechat-remote/clawbot'
    - id: harness-group-assistants
      name: 'dsh-wechat-remote/group-assistants'
    - id: harness-resource-library
      name: 'dsh-wechat-remote/resource-library'
