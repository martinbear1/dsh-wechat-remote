# Native DSH installation loads the same audited core shipped for CLI recovery.
# A relative entry is anchored by the official bundle loader to this package,
# not resolved against another profile's potentially different plugin version.
# Assistant subpaths are this outer package's own exports. Native and profile
# resolution both preserve Node self-reference before considering other packages.
- insert:
    - id: gate
      name: './native/lib/index.js'
    - id: wechat-clawbot
      name: 'dsh-wechat-remote/clawbot'
    - id: harness-assistant-teacher
      name: 'dsh-wechat-remote/assistant-teacher'
    - id: harness-assistant-project
      name: 'dsh-wechat-remote/assistant-project'
    - id: harness-assistant-customizer
      name: 'dsh-wechat-remote/assistant-customizer'
